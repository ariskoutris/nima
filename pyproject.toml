[project]
name = "mystery-dungeon"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "libretro.py==0.10.0",
]

[project.optional-dependencies]
onejev = ["qev"]

[tool.uv.sources]
qev = { git = "https://github.com/OmniJev/OneJev.git", rev = "81ce62f1597c91e46767d4d02d6ac2e18534fe94" }

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
