[project]
name = "mystery-dungeon"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "libretro.py==0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
