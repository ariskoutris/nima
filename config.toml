[game]
rom = "data/game/roms/red-rescue-team.gba"
core = "data/engines/cores/mgba_libretro.dylib"
state = "data/game/checkpoints/square.ss0"
checkpoints = "data/game/checkpoints"
knowledge = "mystery_dungeon/knowledge/game-facts.md"  # what the agent starts out knowing

# Any OpenAI-compatible chat-completions endpoint. api_key_env names the environment variable
# holding the key; leave it out for local servers. request is merged into every request body
# as-is, for endpoint-specific options.
[model]
url = "https://openrouter.ai/api/v1/chat/completions"
name = "z-ai/glm-5.3-flash"
api_key_env = "OPENROUTER_API_KEY"
max_tokens = 4096

[model.request]
reasoning = { effort = "low" }
# OpenRouter: only providers measured on 2026-11-02 to write the schema's keys in order (others,
# e.g. DigitalOcean and Fireworks, chose the action before the reasoning) and to finish within
# max_tokens (Wafer looped on whitespace, Cohere spent it all on reasoning). Together was dropped
# on 2026-11-03: all 15 turns that drifted into Chinese reasoning, of about 7000, came from it.
provider = { only = ["DeepInfra", "Mistral", "Parasail", "BaseTen", "Crusoe"], require_parameters = true }
